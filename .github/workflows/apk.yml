name: Sestavit Android aplikaci (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Capacitor projekt
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Povolit foťák (čtečka QR kódu)
        run: sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml && grep -n permission android/app/src/main/AndroidManifest.xml
      - name: Ikona aplikace
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in icons/mipmap-*; do cp $d/*.png android/app/src/main/res/$(basename $d)/; done
      - name: Sestavit APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Přejmenovat
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vanocni-kviz.apk
      - uses: actions/upload-artifact@v4
        with: { name: vanocni-kviz-apk, path: vanocni-kviz.apk }
      - name: Zveřejnit ke stažení (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Vánoční kvíz – verze ${{ github.run_number }}
          files: vanocni-kviz.apk
          make_latest: true
